<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>符文塔防 · 美术样张 v0.1</title>
<style>
body{margin:0;background:#0d1020;color:#e5e7eb;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#9aa3c7;font-size:13px;margin-bottom:18px}
h2{font-size:15px;margin:22px 0 10px;color:#c7cbe0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-width:760px}
.card{background:#1b2040;border-radius:12px;padding:10px;text-align:center;font-size:12.5px;color:#c7cbe0}
.card .im{width:84px;height:84px;margin:0 auto 6px}
.card .im svg{width:100%;height:100%}
.boss .im{width:100px;height:100px}
.scene{display:grid;grid-template-columns:repeat(9,1fr);max-width:540px;border-radius:12px;overflow:hidden;position:relative}
.scene .t{aspect-ratio:1;position:relative}
.scene .t svg{position:absolute;inset:0;width:100%;height:100%}
.scene .u{position:absolute;inset:-14% 0 0 0}
.scene .u svg{width:100%;height:100%}
</style>
</head>
<body>
<h1>符文塔防 · 美术样张 v0.1</h1>
<div class="sub">矢量绘制，Q 版符文奇幻风格；无血腥、无骷髅、无宗教符号。</div>
<h2>场景示意</h2>
<div class="scene" id="scene"></div>
<h2>塔（1 级外观）</h2><div class="grid" id="towers"></div>
<h2>敌人</h2><div class="grid" id="enemies"></div>
<h2>Boss</h2><div class="grid boss" id="bosses"></div>
<h2>地块</h2><div class="grid" id="tiles"></div>
<script src="art.js"></script>
<script>
const A=window.RuneArt;
for(const k of ["towers","enemies","bosses","tiles"]){
  document.getElementById(k).innerHTML=A.list[k].map(([id,name])=>`<div class="card"><div class="im">${A[id]()}</div>${name}</div>`).join("");
}
// 场景：9×6
const path=new Set(["0,1","1,1","2,1","3,1","4,1","5,1","6,1","7,1","7,2","7,3","7,4","6,4","5,4","4,4","3,4","2,4","1,4","1,5"]);
const special={"3,2":"highland","5,3":"runewell","4,4":"swamp"};
const units={"2,2":"arrow","4,2":"cannon","6,3":"frost","2,3":"tesla","4,3":"arrow","8,3":"cannon",
  "1,1":"norm","3,1":"fast","5,1":"split","7,2":"tank","6,4":"mini","2,4":"boss1"};
let h="";
for(let r=0;r<6;r++)for(let c=0;c<9;c++){
  const k=c+","+r;let tile=path.has(k)?"path":"grass";
  if(special[k])tile=special[k];
  let bg=tile==="grass"?A.grass((c+r)%2):A[tile]();
  if(tile==="swamp")bg=A.swamp();
  h+=`<div class="t">${bg}${units[k]?`<div class="u">${A[units[k]]()}</div>`:""}</div>`;
}
document.getElementById("scene").innerHTML=h;
</script>
</body>
</html>
